name: CI

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # Versao exata: o binario do plugin e verificado contra o commit,
          # entao o SDK precisa ser o mesmo da maquina que gerou o binario.
          # global.json no repositorio mantem local e CI alinhados.
          dotnet-version: '8.0.422'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy sounddevice soundfile

      - name: Run Test Suite
        env:
          TTS_ENGINE: mock
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -W error::ResourceWarning -m unittest discover -s tests

      - name: Run Backend Smoke Check
        env:
          TTS_ENGINE: mock
        run: |
          python smoke_check.py

      - name: Check Release Manifest
        run: |
          python release_manifest.py --check

      - name: Build Unity BepInEx Plugin Assembly
        run: |
          dotnet build unity_mod/src/KokoroTtsPlugin.csproj -c Release

      - name: Verify the committed Unity plugin matches the source
        run: |
          git diff --exit-code -- unity_mod/KokoroTtsPlugin.dll unity_mod/KokoroTtsPlugin.pdb
